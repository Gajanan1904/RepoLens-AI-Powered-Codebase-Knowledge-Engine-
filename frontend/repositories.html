<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View and manage your RepoLens codebase indexes. Select workspaces, upload source archives, or create new configurations.">
  <title>Repositories - RepoLens</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/dark-theme.css">
  <link rel="stylesheet" href="css/light-theme.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/utilities.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/pages/repositories.css">

  <!-- ES Module Entry -->
  <script type="module" src="js/app.js"></script>
</head>
<body class="app-shell">

  <!-- Navbar Target Container -->
  <div id="navbar-container"></div>

  <!-- Authenticated Shell Container -->
  <div class="shell-container">
    
    <!-- Sidebar Target Container -->
    <aside id="sidebar-container" class="sidebar"></aside>

    <!-- Main Content Area -->
    <main class="content-wrapper" id="main-content-scrollable">
      
      <!-- Page Header -->
      <div class="dashboard-header animate-fade-in">
        <div>
          <h1 class="dashboard-title">Repositories</h1>
          <p class="text-muted text-sm mt-xs">Manage codebases and upload source packages for AI indexing.</p>
        </div>
        <div class="flex items-center gap-sm mt-sm sm-mt-none">
          <button class="btn btn-secondary" id="btn-repos-refresh" aria-label="Refresh repository list">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path></svg>
            <span>Refresh</span>
          </button>
          <button class="btn btn-primary" id="btn-create-repo" aria-label="Create new repository">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span>New Repository</span>
          </button>
        </div>
      </div>

      <!-- Search and Filter Toolbar -->
      <div class="repo-toolbar animate-slide-up delay-1">
        <div class="search-input-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="repo-search" class="search-input" placeholder="Search repositories by name..." aria-label="Search repositories">
        </div>
      </div>

      <!-- Repository Grid Container -->
      <div id="repos-container" class="animate-slide-up delay-2"></div>
      
    </main>
  </div>

  <!-- Reusable modal wrapper -->
  <div id="modal-wrapper"></div>

  <!-- Reusable Toast notifications container -->
  <div id="toast-container"></div>

</body>
</html>
