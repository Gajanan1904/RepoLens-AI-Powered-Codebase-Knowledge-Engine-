<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to your RepoLens account to analyze repositories and query your codebase using Gemini AI.">
  <title>Login - RepoLens</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/dark-theme.css">
  <link rel="stylesheet" href="css/light-theme.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/utilities.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/pages/auth.css">

  <!-- ES Module Entry -->
  <script type="module" src="js/app.js"></script>
</head>
<body class="app-wrapper">

  <!-- Header -->
  <header class="navbar-fixed animate-fade-in" id="sticky-navbar">
    <div class="container navbar-container">
      <!-- Logo -->
      <a href="index.html" class="logo" id="nav-logo-link" aria-label="RepoLens Home">
        <div class="logo-icon">R</div>
        <span>RepoLens</span>
      </a>

      <!-- Actions -->
      <div class="flex items-center gap-md">
        <!-- Theme Toggle Button -->
        <button class="theme-toggle-btn" aria-label="Toggle visual theme" id="desktop-theme-toggle">
          <svg class="sun-icon" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="moon-icon" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <a href="index.html" class="btn btn-secondary" id="nav-back-home-btn">Back to Home</a>
      </div>
    </div>
  </header>

  <!-- Main content area centering the auth card -->
  <main class="main-content auth-wrapper">
    <div class="auth-glow"></div>
    
    <div class="auth-card animate-slide-up">
      <div class="auth-header">
        <h1 class="auth-title">Welcome back!</h1>
        <p class="auth-subtitle">Log in to continue to your account or <a href="register.html" id="link-signup">sign up</a></p>
      </div>

      <!-- General Global Error Notification Box -->
      <div class="auth-alert hidden" id="login-global-alert">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        <span id="login-global-error-msg">Incorrect credentials or network error.</span>
      </div>

      <!-- Login Form -->
      <form id="login-form" novalidate>
        <!-- Email Input Group -->
        <div class="form-group" id="group-email">
          <label for="email" class="form-label">Email address</label>
          <div class="form-input-wrapper">
            <input type="email" id="email" name="email" class="form-input" placeholder="Enter your email" required autocomplete="email">
          </div>
          <div class="field-error hidden" id="error-email">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <span id="error-email-msg">Please enter a valid email.</span>
          </div>
        </div>

        <!-- Password Input Group -->
        <div class="form-group" id="group-password">
          <label for="password" class="form-label">Password</label>
          <div class="form-input-wrapper">
            <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
          </div>
          <div class="field-error hidden" id="error-password">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <span id="error-password-msg">Password must be at least 6 characters.</span>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary btn-block mt-lg" id="login-btn">
          <span>Login</span>
        </button>
      </form>

      <a href="index.html" class="back-link" id="link-back-home">
        <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span>Back to homepage</span>
      </a>
    </div>
  </main>

  <footer class="text-center py-md text-muted text-xs">
    <p>&copy; 2026 RepoLens. All rights reserved.</p>
  </footer>

</body>
</html>
